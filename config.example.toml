# proton-presence configuration. Everything here is optional: with this
# file left as it is, every game Discord knows is shown automatically.
# Changes are picked up within a few seconds; no restart needed.

# Games are matched to Discord's own applications using Discord's public
# game list, downloaded about once a week. Set to false to never download
# it; then only the client IDs below are used.
# discord_game_list = true

# Some games report what you are doing in the game ("Playing as Belgium,
# 1853"). A small helper started next to each Proton game passes that on
# to Discord. Set to false to never start the helper; games then show
# their name and play time only.
# game_rich_presence = true

# For games Discord does not know: the Application ID of a Discord
# application of your own (https://discord.com/developers/applications).
# Discord shows that application's name as "Playing <name>".
# default_client_id = "123456789012345678"

# Per-game overrides, keyed by Steam app ID (the number in the game's store
# URL, e.g. https://store.steampowered.com/app/1245620/).
#
# [games.1245620]
# client_id = "234567890123456789"   # your own application for this game
# large_image = "elden_ring"         # key of an art asset in that application
