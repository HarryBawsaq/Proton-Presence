[package]
name = "proton-presence"
version = "0.1.0"
edition = "2021"
# The Rust version of Ubuntu 24.04 LTS, the oldest one supported.
rust-version = "1.75"
description = "Discord Rich Presence for Steam games running through Proton"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
